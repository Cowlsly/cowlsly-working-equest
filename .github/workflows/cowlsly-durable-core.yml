name: Cowlsly Durable Core

on:
  push:
    branches:
      - cowlsly-durable-workflow
  pull_request:
    paths:
      - "src/core/durable_*.py"
      - "tests/test_cowlsly_durable_*.py"
      - "migrations/001_cowlsly_durable_queue.sql"
      - "migrations/002_cowlsly_queue_functions.sql"
      - ".github/workflows/cowlsly-durable-core.yml"

permissions:
  contents: read

jobs:
  durable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install durable-core test dependencies
        run: python -m pip install pytest==9.1.1 httpx==0.28.1
      - name: Run durable core tests
        run: python -m pytest -q tests/test_cowlsly_durable_*.py
